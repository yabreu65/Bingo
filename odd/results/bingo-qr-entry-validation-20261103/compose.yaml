services:
  mongo:
    image: ${MONGO_IMAGE:?Set the already-cached pinned Mongo image}
    pull_policy: never
    platform: linux/amd64
    labels:
      com.bingo.owner: bingo-qr-entry-validation-20261103
      com.bingo.role: mongo
      com.bingo.validation: bingo-qr-entry-validation-20261103
    command: ["mongod", "--bind_ip_all", "--replSet", "bingo-rs", "--keyFile", "/run/secrets/mongo-keyfile", "--auth"]
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set temporary isolated Mongo root user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set temporary isolated Mongo root password}
    volumes:
      - mongo-data:/data/db
      - mongo-config-data:/data/configdb
      - type: bind
        source: ./secrets/mongo-keyfile
        target: /run/secrets/mongo-keyfile
        read_only: true
        bind:
          create_host_path: false
    networks:
      - database
    mem_limit: 2g
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'if (db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD).ok !== 1 || db.adminCommand({ping:1}).ok !== 1 || rs.status().ok !== 1) quit(1)'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  mongo-bootstrap:
    image: ${MONGO_IMAGE:?Set the already-cached pinned Mongo image}
    pull_policy: never
    platform: linux/amd64
    labels:
      com.bingo.owner: bingo-qr-entry-validation-20261103
      com.bingo.role: mongo-bootstrap
      com.bingo.validation: bingo-qr-entry-validation-20261103
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |-
        i=0
        while [ "$$i" -lt 60 ]; do
          if mongosh --quiet --eval 'quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)' 'mongodb://mongo:27017/?directConnection=true&serverSelectionTimeoutMS=1000' >/dev/null 2>&1; then
            exec mongosh --quiet --host mongo:27017 --file /scripts/bootstrap.js
          fi
          i=$$((i + 1))
          sleep 1
        done
        printf '%s\n' 'Mongo readiness probe timed out before bootstrap.' >&2
        exit 1
    restart: "no"
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set temporary isolated Mongo root user}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set temporary isolated Mongo root password}
      MONGODB_URI: ${MONGODB_URI:?Set the isolated replica-set app URI}
    volumes:
      - type: bind
        source: ./mongo-bootstrap.js
        target: /scripts/bootstrap.js
        read_only: true
        bind:
          create_host_path: false
    networks:
      - database
    depends_on:
      mongo:
        condition: service_started
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  backend:
    image: ${BINGO_BACKEND_IMAGE:?Set the already-cached Bingo backend image}
    pull_policy: never
    platform: linux/amd64
    labels:
      com.bingo.owner: bingo-qr-entry-validation-20261103
      com.bingo.role: backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGODB_URI: ${MONGODB_URI:?Set the isolated replica-set app URI}
      JWT_SECRET: ${JWT_SECRET:?Set a temporary isolated JWT secret}
      FRONTEND_URL: ${FRONTEND_URL:?Set the exact HTTPS test origin}
      BINGO_ACCESS_MODE: public
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set the exact HTTPS test origin}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:?Set the verified proxy hop count}
      SPOTIFY_CLIENT_ID: ""
      SPOTIFY_CLIENT_SECRET: ""
      SPOTIFY_REDIRECT_URI: http://localhost:5001/api/spotify/callback
      YOUTUBE_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    expose:
      - "5001"
    networks:
      - database
      - application
    depends_on:
      mongo:
        condition: service_healthy
      mongo-bootstrap:
        condition: service_completed_successfully
    mem_limit: 1g
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    image: ${NGINX_IMAGE:?Set the already-cached Nginx image}
    pull_policy: never
    platform: linux/amd64
    labels:
      com.bingo.owner: bingo-qr-entry-validation-20261103
      com.bingo.role: frontend
      traefik.enable: "true"
      traefik.docker.network: pawtech_public
      traefik.http.routers.bingo-qr-entry-validation-20261103-fallback.rule: "Host(`${BINGO_TEST_HOST:?Set the approved unique test host}`)"
      traefik.http.routers.bingo-qr-entry-validation-20261103-fallback.entrypoints: websecure
      traefik.http.routers.bingo-qr-entry-validation-20261103-fallback.priority: "1"
      traefik.http.routers.bingo-qr-entry-validation-20261103-fallback.middlewares: bingo-m6-trial-auth@docker
      traefik.http.routers.bingo-qr-entry-validation-20261103-fallback.service: bingo-qr-entry-validation-20261103-service
      traefik.http.routers.bingo-qr-entry-validation-20261103-fallback.tls: "true"
      traefik.http.routers.bingo-qr-entry-validation-20261103-fallback.tls.certresolver: letsencrypt

      traefik.http.routers.bingo-qr-entry-validation-20261103-public-ui.rule: "Host(`${BINGO_TEST_HOST:?Set the approved unique test host}`) && (Method(`GET`) || Method(`HEAD`)) && (Path(`/`) || PathRegexp(`^/player/[A-Za-z0-9]{6}/?$`) || PathRegexp(`^/tv/[A-Za-z0-9]{6}/?$`) || PathPrefix(`/assets/`) || PathPrefix(`/music/`) || PathPrefix(`/sounds/`) || Path(`/vite.svg`))"
      traefik.http.routers.bingo-qr-entry-validation-20261103-public-ui.entrypoints: websecure
      traefik.http.routers.bingo-qr-entry-validation-20261103-public-ui.priority: "1000"
      traefik.http.routers.bingo-qr-entry-validation-20261103-public-ui.service: bingo-qr-entry-validation-20261103-service
      traefik.http.routers.bingo-qr-entry-validation-20261103-public-ui.tls: "true"
      traefik.http.routers.bingo-qr-entry-validation-20261103-public-ui.tls.certresolver: letsencrypt

      traefik.http.routers.bingo-qr-entry-validation-20261103-public-api.rule: "Host(`${BINGO_TEST_HOST:?Set the approved unique test host}`) && ((Method(`POST`) && Path(`/api/rooms/join`)) || (Method(`GET`) && PathRegexp(`^/api/rooms/[A-Za-z0-9]{6}$`)) || (Method(`POST`) && PathRegexp(`^/api/rooms/[A-Za-z0-9]{6}/(select-card|reconnect)$`)) || (Method(`GET`) && PathRegexp(`^/api/players/[a-fA-F0-9]{24}$`)) || (Method(`POST`) && PathRegexp(`^/api/rooms/[A-Za-z0-9]{6}/tv-authorization/(claim|renew)$`)))"
      traefik.http.routers.bingo-qr-entry-validation-20261103-public-api.entrypoints: websecure
      traefik.http.routers.bingo-qr-entry-validation-20261103-public-api.priority: "1000"
      traefik.http.routers.bingo-qr-entry-validation-20261103-public-api.service: bingo-qr-entry-validation-20261103-service
      traefik.http.routers.bingo-qr-entry-validation-20261103-public-api.tls: "true"
      traefik.http.routers.bingo-qr-entry-validation-20261103-public-api.tls.certresolver: letsencrypt

      traefik.http.routers.bingo-qr-entry-validation-20261103-public-socket.rule: "Host(`${BINGO_TEST_HOST:?Set the approved unique test host}`) && (Path(`/socket.io`) || PathPrefix(`/socket.io/`)) && (Method(`GET`) || Method(`POST`))"
      traefik.http.routers.bingo-qr-entry-validation-20261103-public-socket.entrypoints: websecure
      traefik.http.routers.bingo-qr-entry-validation-20261103-public-socket.priority: "1000"
      traefik.http.routers.bingo-qr-entry-validation-20261103-public-socket.service: bingo-qr-entry-validation-20261103-service
      traefik.http.routers.bingo-qr-entry-validation-20261103-public-socket.middlewares: bingo-qr-entry-validation-20261103-socket-limit
      traefik.http.routers.bingo-qr-entry-validation-20261103-public-socket.tls: "true"
      traefik.http.routers.bingo-qr-entry-validation-20261103-public-socket.tls.certresolver: letsencrypt

      traefik.http.middlewares.bingo-qr-entry-validation-20261103-socket-limit.ratelimit.average: "50"
      traefik.http.middlewares.bingo-qr-entry-validation-20261103-socket-limit.ratelimit.period: 1s
      traefik.http.middlewares.bingo-qr-entry-validation-20261103-socket-limit.ratelimit.burst: "150"
      traefik.http.services.bingo-qr-entry-validation-20261103-service.loadbalancer.server.port: "80"
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - type: bind
        source: ./frontend-dist
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      - application
      - pawtech_public
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

volumes:
  mongo-data:
    labels:
      com.bingo.owner: bingo-qr-entry-validation-20261103
      com.bingo.role: mongo-data
  mongo-config-data:
    labels:
      com.bingo.owner: bingo-qr-entry-validation-20261103
      com.bingo.role: mongo-config-data

networks:
  database:
    internal: true
    labels:
      com.bingo.owner: bingo-qr-entry-validation-20261103
      com.bingo.role: database
  application:
    internal: true
    labels:
      com.bingo.owner: bingo-qr-entry-validation-20261103
      com.bingo.role: application
  pawtech_public:
    name: pawtech_public
    external: true
