# Deployment-only overlay for the existing public Traefik instance.
# Apply with the M6.2 Compose file, project bingo-contabo-trial-020d654,
# an empty COMPOSE_PROFILES value, and an approved BINGO_TEST_HOST.
services:
  mongo:
    labels:
      com.bingo.owner: bingo-contabo-trial-020d654

  mongo-bootstrap:
    labels:
      com.bingo.owner: bingo-contabo-trial-020d654
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |-
        i=0
        while [ "$$i" -lt 60 ]; do
          if mongosh --quiet --eval 'quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)' 'mongodb://mongo:27017/?directConnection=true&serverSelectionTimeoutMS=1000' >/dev/null 2>&1; then
            exec mongosh --quiet --host mongo:27017 --file /scripts/bootstrap.js
          fi
          i=$$((i + 1))
          sleep 1
        done
        printf '%s\n' 'Mongo readiness probe timed out before bootstrap.' >&2
        exit 1

  backend:
    labels:
      com.bingo.owner: bingo-contabo-trial-020d654

  # Keep the package's Tailscale-only sidecar out of this public-trial stack.
  ingress:
    profiles:
      - private-tailscale
    labels:
      com.bingo.owner: bingo-contabo-trial-020d654

  frontend:
    networks:
      - application
      - ingress
      - pawtech_public
    labels:
      com.bingo.owner: bingo-contabo-trial-020d654
      traefik.enable: "true"
      traefik.docker.network: pawtech_public
      traefik.http.routers.bingo-m6-trial.rule: "Host(`${BINGO_TEST_HOST:?Set the approved BINGO_TEST_HOST}`)"
      traefik.http.routers.bingo-m6-trial.entrypoints: websecure
      traefik.http.routers.bingo-m6-trial.middlewares: bingo-m6-trial-auth
      traefik.http.middlewares.bingo-m6-trial-auth.basicauth.users: "${BINGO_TRIAL_BASIC_AUTH:?Set the dedicated Bingo Basic Auth hash}"
      traefik.http.routers.bingo-m6-trial.tls: "true"
      traefik.http.routers.bingo-m6-trial.tls.certresolver: letsencrypt
      traefik.http.services.bingo-m6-trial.loadbalancer.server.port: "80"

volumes:
  mongo-data:
    labels:
      com.bingo.owner: bingo-contabo-trial-020d654
  mongo-config-data:
    labels:
      com.bingo.owner: bingo-contabo-trial-020d654
  uploads:
    labels:
      com.bingo.owner: bingo-contabo-trial-020d654
  backend-logs:
    labels:
      com.bingo.owner: bingo-contabo-trial-020d654

networks:
  database:
    labels:
      com.bingo.owner: bingo-contabo-trial-020d654
  application:
    labels:
      com.bingo.owner: bingo-contabo-trial-020d654
  ingress:
    labels:
      com.bingo.owner: bingo-contabo-trial-020d654
  pawtech_public:
    name: pawtech_public
    external: true
