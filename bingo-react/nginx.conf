server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # One public HTTPS origin: HTTP API and Socket.IO share the frontend origin.
  location /api/ {
    proxy_pass http://backend:5001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://backend:5001/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
  }

  location = /uploads {
    return 404;
  }

  location ^~ /uploads/ {
    return 404;
  }

  location ~* ^/(music|sounds)/.*\.(mp4|mp3|webm|wav|ogg|m4a)$ {
    add_header Accept-Ranges bytes always;
    add_header Cache-Control "private, max-age=3600" always;
    try_files $uri =404;
  }

  # The TV is top-level, so same-origin permission policy allows the browser
  # to request the explicitly configured loopback media service where supported.
  add_header Permissions-Policy "loopback-network=(self), local-network=(self)" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://127.0.0.1:* http://localhost:* https://api.deezer.com; media-src 'self' https: http://127.0.0.1:* http://localhost:*; img-src 'self' data: https:; frame-src 'self' https://www.youtube.com; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok\n';
  }
}
